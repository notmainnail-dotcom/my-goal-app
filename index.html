<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мой курс">
<title>Мой курс</title>
<style>
:root{--bg:#eaeff4;--card:#fff;--tx:#0f2238;--mu:#5d6d80;--ac:#1d5fd1;--ac2:#dbe7fa;--bd:#cfd9e4;--ok:#1f8a5b;--wr:#b3402c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1623;--card:#16233a;--tx:#e8eef6;--mu:#8da0b8;--ac:#6aa2ff;--ac2:#1c3358;--bd:#25354d;--ok:#4cc38a;--wr:#f08a76}}
:root[data-theme="dark"]{--bg:#0d1623;--card:#16233a;--tx:#e8eef6;--mu:#8da0b8;--ac:#6aa2ff;--ac2:#1c3358;--bd:#25354d;--ok:#4cc38a;--wr:#f08a76}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Avenir Next","Segoe UI",Roboto,sans-serif;padding:14px 14px 96px;max-width:560px;margin:0 auto;min-height:100%}
h1{font-size:28px;margin:6px 0 2px;letter-spacing:-.5px}
h2{font-size:18px;margin:20px 0 8px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.bar{height:12px;border-radius:6px;background:var(--ac2);margin:8px 0;overflow:hidden;background-image:repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,255,255,.55) 14px 18px)}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px 0 0 6px}
.lv{display:flex;gap:8px;margin-top:8px}
button{font:inherit;color:inherit;cursor:pointer}
.lv button{flex:1;padding:12px 6px;border-radius:10px;border:1.5px solid var(--bd);background:transparent;font-weight:600}
.lv button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.dots{letter-spacing:3px;color:var(--ac);font-size:13px;margin-top:6px}
.warn{border-color:var(--wr);color:var(--wr);font-weight:600}
.st{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.st b{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.st.d b{background:var(--ok);border-color:var(--ok)}
.st.d span{color:var(--mu)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:700;margin:8px 0}
.btn.g{background:transparent;border:1.5px solid var(--ac);color:var(--ac)}
.x{background:none;border:0;color:var(--mu);font-size:20px;padding:0 6px}
textarea{width:100%;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:12px 2px 10px;font-size:13px;color:var(--mu);font-weight:600}
nav button.on{color:var(--ac)}
nav button span{display:block;font-size:20px}
</style></head><body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
var K='life_v1';
var H=[
{id:'en',n:'Английский',L:['15 мин','45 мин','до 2 ч']},
{id:'net',n:'Сети',L:['15 мин','45 мин','до 2 ч']},
{id:'gym',n:'Зал / движение',L:['Был']},
{id:'rd',n:'Слот разнообразия (книги)',L:['Читал']},
{id:'sl',n:'Сон по режиму',L:['Да']},
{id:'ppl',n:'Шаг к людям (раз в неделю)',L:['Сделал']}];
var S,tab='today';
var p=function(n){return String(n).padStart(2,'0')};
var dk=function(d){return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
var tm=function(d){return p(d.getHours())+':'+p(d.getMinutes())};
var nowS=function(){var d=new Date();return dk(d)+' '+tm(d)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function st(a){return a.map(function(x){return{x:x,done:null}})}
function init(){return{v:1,start:dk(new Date()),logs:{},debt:{total:0,paid:[]},
shelf:['Испанский','Электроника и микроконтроллеры'],
goals:[
{t:'Английский: дней занятий за месяц',type:'count',h:'en',target:24},
{t:'Сети: дней занятий за месяц',type:'count',h:'net',target:24},
{t:'Зал: посещений за месяц',type:'count',h:'gym',target:12},
{t:'Шаг к людям: раз за месяц',type:'count',h:'ppl',target:4},
{t:'Рассказ о себе по-английски (A1 → A2)',type:'steps',steps:st(['Выучить 100 базовых слов о себе: имя, работа, семья, еда, хобби','Освоить I am, I have, I like, I work, I live','Написать 8–10 простых предложений о себе','Записать себя голосом на телефон','Прочитать вслух без бумажки 3 раза','Рассказать Claude и разобрать ошибки'])},
{t:'Сети L3: отчёт, как идут данные (поправь шаги под свой уровень)',type:'steps',steps:st(['Повторить IPv4-адресацию и маски','Решить 20 задач на подсети','Разобрать таблицу маршрутизации','Статический и динамический маршрут: объяснить своими словами','Собрать мини-лабу и записать, что настроил','Рассказать Claude, как идут данные на L3'])}
]}}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}if(!S||!S.v)S=init()}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function endD(){var e=new Date(S.start);e.setUTCDate(e.getUTCDate()+30);return e.toISOString().slice(0,10)}
function dayN(){return Math.floor((new Date(dk(new Date()))-new Date(S.start))/864e5)+1}
function cnt(g){var e=endD(),n=0;for(var d in S.logs){if(d>=S.start&&d<=e&&S.logs[d][g.h])n++}return n}
function pct(g){if(g.type=='count')return Math.min(100,Math.round(cnt(g)/g.target*100));var n=g.steps.length;return n?Math.round(g.steps.filter(function(s){return s.done}).length/n*100):0}
function total(){var a=S.goals.map(pct);return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length):0}
function bar(v){return '<div class="bar"><i style="width:'+v+'%"></i></div>'}
function ago(n){var d=new Date();d.setDate(d.getDate()-n);return dk(d)}
function dots(h){var s='';for(var i=6;i>=0;i--){s+=(S.logs[ago(i)]&&S.logs[ago(i)][h])?'●':'○'}return s}
function vToday(){
var t=dk(new Date()),L=S.logs[t]||{},y=S.logs[ago(1)]||{};
var h='<h1>Сегодня</h1><div class="mu">'+t+', день '+Math.min(dayN(),30)+' из 30. Отчёт Claude: '+endD()+'</div>';
h+='<div class="card"><div class="row"><span>Прогресс месяца</span><span class="big">'+total()+'%</span></div>'+bar(total())+'</div>';
if(dayN()>1&&!y.en&&!y.net&&!L.en&&!L.net)h+='<div class="card warn">Вчера был пропуск. Сегодня только минимум: 15 минут английского и 15 минут сетей. Два пропуска подряд нельзя.</div>';
H.forEach(function(x){var c=(L[x.id]||{}).lvl||0;
h+='<div class="card"><div class="row"><b>'+x.n+'</b><span class="mu">'+(c?'отмечено в '+L[x.id].t:'')+'</span></div><div class="lv">'+
x.L.map(function(l,i){return '<button class="'+(c==i+1?'on':'')+'" data-a="lv" data-h="'+x.id+'" data-i="'+(i+1)+'">'+l+'</button>'}).join('')+
'</div><div class="dots">'+dots(x.id)+'</div></div>'});
h+='<div class="mu">Застрял: 5 минут разбираешься, записываешь, что именно непонятно, и идёшь дальше. Телефон лежит в другой комнате.</div>';
return h}
function vGoals(){
var h='<h1>Цели месяца</h1>';
S.goals.forEach(function(g,gi){var v=pct(g);
h+='<div class="card"><div class="row"><b>'+esc(g.t)+'</b><b>'+v+'%</b></div>'+bar(v);
if(g.type=='count')h+='<div class="mu">'+cnt(g)+' из '+g.target+'</div>';
else{g.steps.forEach(function(s,si){h+='<button class="st '+(s.done?'d':'')+'" data-a="stp" data-g="'+gi+'" data-s="'+si+'"><b>'+(s.done?'✓':'')+'</b><span>'+esc(s.x)+(s.done?'<br><small>'+s.done+'</small>':'')+'</span></button>'});
h+='<button class="btn g" data-a="addst" data-g="'+gi+'">Добавить шаг</button>'}
h+='</div>'});
return h}
function vDebt(){
var d=S.debt,paid=d.paid.reduce(function(a,b){return a+b.s},0),v=d.total?Math.min(100,Math.round(paid/d.total*100)):0;
var h='<h1>Долги</h1><div class="card"><div class="row"><span>Выплачено</span><span class="big">'+v+'%</span></div>'+bar(v)+
'<div class="mu">Всего: '+d.total+'. Выплачено: '+paid+'. Осталось: '+Math.max(0,d.total-paid)+'</div></div>'+
'<button class="btn" data-a="pay">Добавить выплату</button><button class="btn g" data-a="tot">Указать общую сумму долгов</button>';
d.paid.slice().reverse().forEach(function(x,i){h+='<div class="card row"><span>'+x.s+'</span><span class="mu">'+x.d+'</span><button class="x" data-a="dpay" data-i="'+(d.paid.length-1-i)+'">×</button></div>'});
return h+'<div class="mu">Суммы хранятся только на твоём телефоне.</div>'}
function vMore(){
var h='<h1>Ещё</h1><h2>Полка идей</h2><div class="mu">Новое дело берём с полки только после 30 дней стабильных якорей и только по одному.</div>';
S.shelf.forEach(function(x,i){h+='<div class="card row"><span>'+esc(x)+'</span><button class="x" data-a="dsh" data-i="'+i+'">×</button></div>'});
h+='<button class="btn g" data-a="ash">Добавить на полку</button>'+
'<h2>Отчёт и резервная копия</h2><button class="btn" data-a="rep">Составить отчёт для Claude</button><button class="btn g" data-a="exp">Показать резервную копию</button><button class="btn g" data-a="imp">Загрузить копию из текста</button>'+
'<textarea id="io" rows="7" placeholder="Здесь появится текст. Скопируй его или вставь копию и нажми «Загрузить»."></textarea>'+
'<h2>Месяц</h2><button class="btn g" data-a="newm">Начать новый месяц с сегодняшнего дня</button>';
return h}
function render(){
var v={today:vToday,goals:vGoals,debt:vDebt,more:vMore}[tab]();
document.getElementById('app').innerHTML=v;
var T=[['today','✓','Сегодня'],['goals','◎','Цели'],['debt','₽','Долги'],['more','≡','Ещё']];
document.getElementById('nav').innerHTML=T.map(function(x){return '<button class="'+(tab==x[0]?'on':'')+'" data-a="tab" data-t="'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join('')}
function report(){
var r='Отчёт на '+nowS()+', день '+Math.min(dayN(),30)+' из 30. Общий прогресс: '+total()+'%\n';
S.goals.forEach(function(g){r+='- '+g.t+': '+pct(g)+'%'+(g.type=='count'?' ('+cnt(g)+' из '+g.target+')':'')+'\n'});
var d=S.debt,pd=d.paid.reduce(function(a,b){return a+b.s},0);
r+='- Долги выплачены на '+(d.total?Math.round(pd/d.total*100):0)+'%';return r}
document.addEventListener('click',function(e){
var b=e.target.closest('[data-a]');if(!b)return;
var a=b.dataset.a,D=b.dataset,io=function(){return document.getElementById('io')};
if(a=='tab'){tab=D.t;render();window.scrollTo(0,0);return}
if(a=='lv'){var d=dk(new Date());S.logs[d]=S.logs[d]||{};var c=S.logs[d][D.h];
if(c&&c.lvl==D.i)delete S.logs[d][D.h];else S.logs[d][D.h]={lvl:+D.i,t:tm(new Date())}}
else if(a=='stp'){var s=S.goals[D.g].steps[D.s];s.done=s.done?null:nowS()}
else if(a=='addst'){var t=prompt('Новый шаг');if(t)S.goals[D.g].steps.push({x:t,done:null})}
else if(a=='tot'){var n=parseFloat(prompt('Общая сумма долгов (число)'));if(n>=0)S.debt.total=n}
else if(a=='pay'){var n2=parseFloat(prompt('Сумма выплаты (число)'));if(n2>0)S.debt.paid.push({s:n2,d:nowS()})}
else if(a=='dpay'){S.debt.paid.splice(+D.i,1)}
else if(a=='ash'){var t2=prompt('Что добавить на полку?');if(t2)S.shelf.push(t2)}
else if(a=='dsh'){S.shelf.splice(+D.i,1)}
else if(a=='newm'){if(confirm('Начать новый месяц? Отметки сохранятся, цели месяца начнут считаться с сегодня.')){S.start=dk(new Date());S.goals.forEach(function(g){if(g.type=='steps')g.steps.forEach(function(s){s.done=null})})}}
else if(a=='rep'){io().value=report();try{navigator.clipboard.writeText(io().value)}catch(x){}io().select();return}
else if(a=='exp'){io().value=JSON.stringify(S);io().select();return}
else if(a=='imp'){try{var o=JSON.parse(io().value);if(o&&o.v&&o.goals){S=o;save();render();alert('Копия загружена')}else alert('Это не копия данных')}catch(x){alert('Не удалось прочитать текст')}return}
save();render()});
load();render();
</script></body></html>
