function migrate(o){
if(!Array.isArray(o.habits))o.habits=JSON.parse(JSON.stringify(DEF_H));

o.stop=Object.assign({why:'',alts:DEF_ALTS.slice(),presses:[]},o.stop||{});
o.food=Object.assign({prof:null,kcal:0,custom:[],dishes:[],log:{},weight:[]},o.food||{});
// цели с шагами привязываем к якорям, чтобы следующий шаг был виден прямо в карточке привычки
o.goals.forEach(g=>{if(g.type=='steps'&&!('h' in g)){const m=/англ/i.test(g.t)?'en':/сет/i.test(g.t)?'net':'';g.h=o.habits.some(x=>x.id==m)?m:''}});
o.v=3;return o}

function links(){
const days=[];for(let i=0;i<60;i++){const k=ago(i),M=S.mood[k];if(M&&M.pm)days.push(k)}
if(days.length<14)return `<h2>Связи</h2><div class="mu">Появятся, когда наберётся 14 дней с итогом дня. Сейчас: ${days.length}.</div>`;
const out=[];
const cmp=(label,test)=>{const y=[],n=[];days.forEach(k=>{const r=test(k);if(r===true)y.push(S.mood[k].pm);else if(r===false)n.push(S.mood[k].pm)});
if(y.length>=3&&n.length>=3)out.push({label,a:avg(y),b:avg(n)})};
S.habits.forEach(x=>cmp(esc(x.ic)+' '+esc(x.n),k=>logged(k,x.id)));
cmp('Правило 4 часов соблюдено',k=>S.mood[k].rule);
if(S.shift)cmp('Смена, а не выходной',k=>isShift(k));
out.sort((p,q)=>Math.abs(q.a-q.b)-Math.abs(p.a-p.b));
let h='<h2>Связи</h2><div class="mu">Средний итог дня: когда было / когда не было.</div>'+out.slice(0,6).map(o=>`<div class="link"><span>${o.label}</span><b>${o.a.toFixed(1)} / ${o.b.toFixed(1)}</b></div>`).join('');
const anc=S.habits.filter(x=>x.a),bad=[],good=[];
if(anc.length)for(let i=0;i<60;i++){const k=ago(i),M=S.mood[k];if(!M||!M.am)continue;const done=anc.some(a=>logged(k,a.id))?1:0;if(M.am<=2)bad.push(done);else if(M.am>=4)good.push(done)}
if(bad.length>=3&&good.length>=3)h+=`<div class="link"><span>Якоря сделаны после плохого утра / хорошего</span><b>${Math.round(avg(bad)*100)}% / ${Math.round(avg(good)*100)}%</b></div>`;
return h}

openSheet(x.n,`<div class="mu" style="margin-bottom:12px">${fmt(x.k)} ккал · Б ${x.p} Ж ${x.f} У ${x.c} на 100 г</div>`+
(x.u?seg('unit',[['u',esc(x.u)+' ('+x.ug+' г)'],['g','Граммы']],'u'):'')+
`<label class="lb" id="f_al">${x.u?'Сколько ('+esc(x.u)+')':'Сколько грамм'}</label><input class="in" id="f_a" inputmode="decimal" value="${x.u?1:100}"><div class="hint" id="f_pv"></div>`,
()=>{const g=grams(x);if(!(g>0)){alert('Укажи количество');return}const e=entry(x,g);addEntries(fkey(),[e]);toast('Добавлено: '+e.k+' ккал');return true},
x.id[0]=='u'?()=>{if(!confirm('Удалить «'+x.n+'» из своих продуктов? Записи в дневнике останутся.'))return;S.food.custom=S.food.custom.filter(c=>c.id!=x.id);return true}:null,'Удалить из моих продуктов');
curFood=x;pv(x)}
function customSheet(){
openSheet('Свой продукт',`<label class="lb">Название</label><input class="in" id="f_n" placeholder="Например: сырники">`+
`<label class="lb">На 100 г</label><div class="row2">${[['k','ккал'],['p','Б'],['f','Ж'],['c','У']].map(o=>`<input class="in" id="f_${o[0]}" inputmode="decimal" placeholder="${o[1]}">`).join('')}</div><div class="hint">Смотри на упаковке. Если знаешь только калории, остальное оставь пустым.</div>`+
`<label class="lb">Порция (необязательно)</label><div class="row2"><input class="in" id="f_u" placeholder="шт, тарелка…"><input class="in" id="f_ug" inputmode="decimal" placeholder="грамм в ней"></div>`,
()=>{const n=$('f_n').value.trim(),k=num($('f_k').value);if(!n||!(k>=0)){alert('Нужно название и калории');return}
const v=id=>num($(id).value)||0,u=$('f_u').value.trim(),ug=v('f_ug');
const x={id:'u'+Date.now().toString(36),n,k,p:v('f_p'),f:v('f_f'),c:v('f_c'),u:u&&ug?u:'',ug:u&&ug?ug:0};
S.food.custom.unshift(x);setTimeout(()=>amountSheet(x.id),0);return true},null)}
function quickSheet(){
openSheet('Просто калории',`<label class="lb">Что съел</label><input class="in" id="f_n" placeholder="Например: обед в столовой"><label class="lb">Калории</label><input class="in" id="f_k" inputmode="numeric"><label class="lb">Белок, г (если знаешь)</label><input class="in" id="f_p" inputmode="decimal">`,
()=>{const k=num($('f_k').value);if(!(k>0)){alert('Укажи калории');return}
addEntries(fkey(),[{n:$('f_n').value.trim()||'Без названия',g:0,k:Math.round(k),p:num($('f_p').value)||0,f:0,c:0}]);return true},null)}
function dishSheet(){const Ds=S.food.dishes;
openSheet('Мои блюда',(Ds.length?'<div class="res">'+Ds.map((d,i)=>`<div class="li"><button class="ht plain" data-a="dadd" data-i="${i}"><b>${esc(d.n)}</b><small>${d.items.reduce((a,e)=>a+e.k,0)} ккал · ${d.items.map(e=>esc(e.n)).join(', ')}</small></button><button class="ib" data-a="ddel" data-i="${i}" aria-label="Удалить">✕</button></div>`).join('')+'</div>'
:'<div class="mu" style="margin:8px 2px">Блюд пока нет. Запиши еду как обычно, потом собери из записей блюдо. В следующий раз добавишь его одним касанием.</div>')+
'<button class="btn g" data-a="dnew" style="margin:12px 0 0">＋ Собрать блюдо из записей дня</button>',null,null)}
function dishNew(){const L=S.food.log[fkey()]||[];if(!L.length){alert('Сначала запиши еду за день, потом собери из неё блюдо');return}
openSheet('Новое блюдо',`<label class="lb">Название</label><input class="in" id="f_n" placeholder="Например: мой завтрак"><label class="lb">Что входит</label><div class="chips" id="f_it">${L.map((e,i)=>`<button type="button" class="on" data-a="chip" data-i="${i}">${esc(e.n)}${e.g?' '+e.g+' г':''}</button>`).join('')}</div>`,
()=>{const n=$('f_n').value.trim(),sel=[...document.querySelectorAll('#f_it .on')].map(b=>L[b.dataset.i]);if(!n||!sel.length){alert('Нужно название и хотя бы одна запись');return}
S.food.dishes.push({n,items:sel.map(noT)});toast('Блюдо сохранено');return true},null)}
function profSheet(){const P=S.food.prof||{w:'',h:'',age:'',act:'mid',goal:'gain'};
openSheet('Норма питания',
`<div class="row2"><div><label class="lb">Вес, кг</label><input class="in" id="f_w" inputmode="decimal" value="${lastW()||P.w}"></div><div><label class="lb">Рост, см</label><input class="in" id="f_hh" inputmode="numeric" value="${P.h}"></div><div><label class="lb">Возраст</label><input class="in" id="f_ag" inputmode="numeric" value="${P.age}"></div></div>`+
`<label class="lb">Активность</label>${seg('act',ACT.map(a=>[a[0],a[1]]),P.act)}<div class="hint" style="margin-top:-4px">${ACT.map(a=>'<b>'+a[1]+'</b>: '+a[2]).join('<br>')}</div>`+
`<label class="lb">Цель</label>${seg('goal',[['gain','Набор веса'],['keep','Удержать вес']],P.goal)}`+
`<label class="lb">Своя норма, ккал (необязательно)</label><input class="in" id="f_k" inputmode="numeric" value="${S.food.kcal||''}" placeholder="Пусто: посчитает формула"><div class="hint">Формула Миффлина — Сан Жеора, для набора +400 ккал. Белок 1,8 г на кг, жиры 1 г на кг, остальное углеводы.</div>`,
()=>{const w=num($('f_w').value),hh=num($('f_hh').value),ag=num($('f_ag').value);
if(!(w>30&&w<250&&hh>120&&hh<230&&ag>12&&ag<100)){alert('Проверь вес, рост и возраст');return}
S.food.prof={w,h:hh,age:ag,act:val('act')||'mid',goal:val('goal')||'gain'};S.food.kcal=parseInt($('f_k').value)||0;
if(lastW()===null||Math.abs(lastW()-w)>0.05)setWeight(today(),w);
toast('Норма: '+fmt(norm().k)+' ккал');return true},null)}

// ---------- красная кнопка ----------
const rec=()=>S.stop.presses[SC.i];
function left(){const s=Math.max(0,STOP_MIN*60-Math.floor((Date.now()-SC.t0)/1000));return p(Math.floor(s/60))+':'+p(s%60)}
function stopOpen(){S.stop.presses.push({t:nowS(),r:null});save();
SC={t0:Date.now(),i:S.stop.presses.length-1,alt:null,step:'wait'};stopRender();$('stop').classList.add('open');$('stop').scrollTop=0;
clearInterval(stopTimer);stopTimer=setInterval(stopTick,1000)}
function stopTick(){if(!SC)return;const el=$('stt');if(el)el.textContent=left();if(SC.step=='wait'&&Date.now()-SC.t0>=STOP_MIN*6e4){SC.step='ask';stopRender()}}
function stopClose(){clearInterval(stopTimer);SC=null;$('stop').classList.remove('open','won');$('stop').innerHTML='';save();render()}
function stopRender(){
const P=S.stop,c=SC,won=P.presses.filter(x=>x.r=='won').length,times=n=>n+' '+plural(n,'раз','раза','раз');
let h='<button class="sclose" data-a="sx" aria-label="Закрыть">✕</button><div class="in2">';
if(c.step=='wait'||c.step=='ask'){
h+=`<div class="sbig">Стоп.</div><div class="slead">Дай себе ${STOP_MIN} минут. Желание накатывает волной и спадает.</div><div class="stimer" id="stt">${left()}</div>`;
h+=`<div class="sbox"><small>Зачем я меняюсь</small>${P.why?esc(P.why).replace(/\n/g,'<br>'):'<span style="opacity:.6">Здесь будут твои слова. Напиши их в «Ещё» → «Красная кнопка».</span>'}</div>`;
if(won)h+=`<div class="sbox"><small>Ты уже передумал</small><span style="font-size:24px;font-weight:800">${times(won)}</span></div>`;
if(P.alts.length)h+='<div class="sbox"><small>Вместо этого, выбери одно</small>'+P.alts.map((a,i)=>`<button class="salt ${c.alt===i?'on':''}" data-a="salt" data-i="${i}">${esc(a)}</button>`).join('')+'</div>';
if(c.step=='ask')h+=`<div class="sq">${STOP_MIN} минут прошли. Отпустило?</div>`;
h+=`<button class="sbtn" data-a="swon">${c.step=='ask'?'Да, передумал':'Я передумал'}</button><button class="sbtn gh" data-a="sslip">${c.step=='ask'?'Всё равно хочу':'Не могу ждать'}</button>`}
else if(c.step=='trig')h+='<div class="sbig m">Ок. Без упрёков.</div><div class="slead">Что запустило? Это только для тебя.</div>'+TRIG.map(t=>`<button class="salt" data-a="strig" data-v="${t}">${t}</button>`).join('');
else if(c.step=='give')h+='<div class="sbig m">Сколько даёшь себе?</div><div class="slead">Ограничение лучше, чем «всё или ничего».</div>'+[[30,'30 минут'],[60,'1 час']].map(o=>`<button class="salt" data-a="sgive" data-v="${o[0]}">${o[1]}</button>`).join('');
else if(c.step=='slip')h+=`<div class="sbig m">Это не конец.</div><div class="sbox">Поставь таймер в «Часах» на ${c.give==60?'1 час':'30 минут'}. Когда зазвонит, вставай и выходи из комнаты.</div><div class="sbox">Срыв — это один эпизод, а не итог. Завтра обычный день по плану.</div><button class="sbtn" data-a="sx">Закрыть</button>`;
else if(c.step=='won')h+=`<div class="sbig">Победа.</div><div class="slead" style="font-size:20px;font-weight:700;opacity:1">Ты передумал уже ${times(won)}.</div><div class="sbox">${c.alt!==null?'Теперь сделай: <b>'+esc(P.alts[c.alt])+'</b>':'Сделай сейчас одно из «вместо этого», пока желание не вернулось.'}</div><button class="sbtn" data-a="sx">Закрыть</button>`;
$('stop').innerHTML=h+'</div>';$('stop').classList.toggle('won',c.step=='won')}
function stopSheet(){const P=S.stop;
openSheet('Красная кнопка',`<label class="lb">Зачем я меняюсь, твоими словами</label><textarea class="in" id="f_wy" rows="4" placeholder="Это ты увидишь при каждом нажатии">${esc(P.why)}</textarea>`+
`<label class="lb">Вместо этого, каждое с новой строки</label><textarea class="in" id="f_alts" rows="5">${esc(P.alts.join('\n'))}</textarea>`,
()=>{P.why=$('f_wy').value.trim();P.alts=$('f_alts').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6);return true},null)}

// ---------- отчёт и прочее ----------
function report(){
const d=S.debt,pdx=d.paid.reduce((a,b)=>a+b.s,0);
let r=`Отчёт на ${nowS()}, день ${Math.min(dayN(),30)} из 30. Общий прогресс: ${total()}%\n`;
if(S.shift)r+=`График 2/2: сегодня ${isShift(today())?'смена':'выходной'}\n`;
r+='Цели:\n';
S.goals.forEach(g=>{r+=`- ${g.t}: ${pct(g)}%`+(g.type=='count'?` (${cnt(g)} из ${g.target})`:'')+'\n'});
r+='Привычки за последние 7 дней:\n';
S.habits.forEach(x=>{let k=0;for(let i=0;i<7;i++)if(logged(ago(i),x.id))k++;r+=`- ${x.n}: ${k} из 7\n`});
const ms=[];for(let i=6;i>=0;i--){const k=ago(i);if(S.mood[k])ms.push([k,S.mood[k]])}
if(ms.length){const am=ms.filter(x=>x[1].am).map(x=>x[1].am),pm=ms.filter(x=>x[1].pm).map(x=>x[1].pm);
r+=`Настроение за 7 дней (из 5): утро в среднем ${am.length?avg(am).toFixed(1):'—'}, итог дня ${pm.length?avg(pm).toFixed(1):'—'}, тяжёлых дней (1–2): ${pm.filter(v=>v<=2).length}\n`;
ms.forEach(([k,M])=>{if(M.what||M.win||(M.tags&&M.tags.length))r+=`- ${k}${M.pm?' ('+M.pm+'/5)':''}${M.tags&&M.tags.length?' ['+M.tags.join(', ')+']':''}${M.what?': '+M.what:''}${M.win?' | получилось: '+M.win:''}\n`});
const rl=ms.filter(x=>x[1].rule!==undefined);if(rl.length)r+=`Правило 4 часов: соблюдено ${rl.filter(x=>x[1].rule).length} из ${rl.length} смен\n`}
r+=`Засчитано «получилось» за месяц: ${wins()}\n`;
const fd=[];for(let i=1;i<=7;i++){const k=ago(i);if((S.food.log[k]||[]).length)fd.push(dayFood(k))}
const N=norm();if(fd.length)r+=`Еда (прошлые 7 дней, записано ${fd.length}): в среднем ${Math.round(avg(fd.map(x=>x.k)))} ккал, белок ${Math.round(avg(fd.map(x=>x.p)))} г${N?' (норма '+N.k+' ккал, белок '+N.p+' г)':''}\n`;
const W=S.food.weight;if(W.length){const l=W[W.length-1],f=W.find(x=>diff(x.d,l.d)<=28)||W[0];r+=`Вес: ${l.kg} кг (${l.d})${f!==l?', с '+f.d+': '+(l.kg-f.kg>0?'+':'')+(l.kg-f.kg).toFixed(1)+' кг':''}\n`}
// красная кнопка: в отчёт только число нажатий
const pr=S.stop.presses;r+=`Красная кнопка: нажатий за 7 дней ${pr.filter(x=>x.t.slice(0,10)>=ago(6)).length}, за месяц ${pr.filter(x=>x.t.slice(0,10)>=S.start).length}\n`;
return r+'Долги выплачены на '+(d.total?Math.round(pdx/d.total*100):0)+'%'}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
function copyIO(text){const io=$('io');io.value=text;io.select();
if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Скопировано'),()=>toast('Выдели текст и скопируй'))}
function applyTheme(){const r=document.documentElement;if(S.theme=='auto')r.removeAttribute('data-theme');else r.dataset.theme=S.theme;
document.querySelector('meta[name=theme-color]').content=getComputedStyle(r).getPropertyValue('--bg').trim()}

document.addEventListener('input',e=>{const id=e.target.id;
if(id=='f_q')$('f_res').innerHTML=foodList(e.target.value);else if(id=='f_a'&&curFood)pv(curFood)});

document.addEventListener('click',e=>{
const b=e.target.closest('[data-a]');if(!b)return;
const a=b.dataset.a,D=b.dataset;
switch(a){
case 'tab':tab=D.t;render();window.scrollTo(0,0);return;
case 'day':day=D.d;render();return;
case 'seg':{if(b.classList.contains('on'))return;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));whens();
if(b.parentNode.dataset.seg=='unit'&&curFood){const n=num($('f_a').value)||0;$('f_a').value=D.v=='g'?Math.round(n*curFood.ug):+(n/curFood.ug).toFixed(1);
$('f_al').textContent=D.v=='g'?'Сколько грамм':'Сколько ('+curFood.u+')';pv(curFood)}return}
case 'sw':b.parentNode.dataset.v=D.c;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));return;
case 'chip':b.classList.toggle('on');return;
case 'fsel':b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));return;
case 'sclose':closeSheet();return;
case 'ssave':if(!(sheetSave&&sheetSave()))return;closeSheet();break;
case 'sdel':if(!(sheetDel&&sheetDel()))return;closeSheet();break;
case 'lv':{const d=fkey();S.logs[d]=S.logs[d]||{};const c=S.logs[d][D.h];
if(c&&c.lvl==D.i)delete S.logs[d][D.h];else S.logs[d][D.h]={lvl:+D.i,t:day=='y'?'(за вчера) '+tm(new Date()):tm(new Date())};break}
case 'stp':{const s=S.goals[D.g].steps[D.s];s.done=s.done?null:nowS();if(s.done)toast('Шаг засчитан ✓');break}
case 'egoal':goalSheet(+D.g);return;
case 'ehab':habitSheet(+D.i);return;
case 'hmv':{const i=+D.i,j=i+ +D.d,H=S.habits;[H[i],H[j]]=[H[j],H[i]];break}
case 'shift':shiftSheet();return;
// настроение
case 'mam':{const k=fkey(),m=S.mood[k]=S.mood[k]||{};if(m.am==D.v)delete m.am;else m.am=+D.v;break}
case 'mpm':{const k=fkey(),m=S.mood[k]=S.mood[k]||{};m.pm=+D.v;save();render();moodSheet(k);return}
case 'medit':moodSheet(fkey());return;
case 'mhist':moodHist();return;
case 'mday':b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x==b));$('f_md').innerHTML=mdet(D.d);return;
case 'mnote':S.moodNote=today();break;
// еда
case 'fadd':foodSheet();return;
case 'fpick':amountSheet(D.id);return;
case 'fnew':customSheet();return;
case 'fquick':quickSheet();return;
case 'fdish':dishSheet();return;
case 'dnew':dishNew();return;
case 'dadd':{const d=S.food.dishes[D.i];addEntries(fkey(),d.items);closeSheet();toast('Добавлено: '+d.n);break}
case 'ddel':if(!confirm('Удалить блюдо «'+S.food.dishes[D.i].n+'»?'))return;S.food.dishes.splice(+D.i,1);save();dishSheet();return;
case 'fcopy':{const src=S.food.log[add(fkey(),-1)]||[];if(!src.length){toast('Днём раньше записей нет');return}addEntries(fkey(),src.map(noT));toast('Добавлено записей: '+src.length);break}
case 'fdel':{const L=S.food.log[fkey()];if(!confirm('Удалить «'+L[D.i].n+'»?'))return;L.splice(+D.i,1);break}
case 'fw':numSheet('Вес','Вес, кг (утром, до еды)',lastW()||'',n=>{if(!(n>30&&n<250)){alert('Проверь число');return}setWeight(today(),n);return true});return;
case 'fprof':profSheet();return;
// красная кнопка
case 'stop':stopOpen();return;
case 'salt':SC.alt=+D.i;stopRender();return;
case 'swon':rec().r='won';SC.step='won';clearInterval(stopTimer);save();stopRender();return;
case 'sslip':SC.step='trig';clearInterval(stopTimer);stopRender();return;
case 'strig':rec().trig=D.v;SC.step='give';save();stopRender();return;
case 'sgive':rec().give=+D.v;rec().r='slip';SC.give=+D.v;SC.step='slip';save();stopRender();return;
case 'sx':stopClose();return;
case 'stopset':stopSheet();return;
// долги, полка, данные
case 'pay':numSheet('Выплата','Сумма выплаты','',n=>{if(!n){alert('Сумма должна быть больше нуля');return}S.debt.paid.push({s:n,d:nowS()});return true});return;
case 'tot':numSheet('Общая сумма долгов','Сколько всего нужно выплатить',S.debt.total||'',n=>{S.debt.total=n;return true});return;
case 'dpay':if(!confirm('Удалить выплату '+fmt(S.debt.paid[D.i].s)+'?'))return;S.debt.paid.splice(+D.i,1);break;
case 'ash':openSheet('На полку идей','<label class="lb">Что отложить на потом</label><input class="in" id="f_v">',()=>{const t=$('f_v').value.trim();if(!t)return;S.shelf.push(t);return true},null);return;
case 'dsh':if(!confirm('Убрать «'+S.shelf[D.i]+'» с полки?'))return;S.shelf.splice(+D.i,1);break;
case 'theme':S.theme=D.v;applyTheme();break;
case 'newm':if(!confirm('Начать новый месяц? Отметки сохранятся, цели месяца начнут считаться с сегодня, шаги сбросятся.'))return;
S.start=today();S.goals.forEach(g=>{if(g.type=='steps')g.steps.forEach(s=>{s.done=null})});break;
case 'rep':copyIO(report());return;
case 'exp':S.bk=today();save();copyIO(JSON.stringify(S));toast('Копия готова. Сохрани её в Заметки');return;
case 'imp':{let o;try{o=JSON.parse($('io').value)}catch(x){alert('Не удалось прочитать текст');return}
if(!o||!o.v||!o.goals){alert('Это не копия данных');return}
if(!confirm('Заменить текущие данные этой копией?'))return;
S=migrate(o);applyTheme();toast('Копия загружена');break}
default:return}
save();render()});

// если приложение висело открытым, после полуночи переключаемся на новый день
function refresh(){if(shownDay!=today()){day='t';render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
window.addEventListener('pageshow',refresh);
window.addEventListener('focus',refresh);
setInterval(refresh,60000);

load();applyTheme();render();
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
