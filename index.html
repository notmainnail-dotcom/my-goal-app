function migrate(o){
if(!Array.isArray(o.habits))o.habits=JSON.parse(JSON.stringify(DEF_H));
o.logs=o.logs||{};o.debt=o.debt||{total:0,paid:[]};o.shelf=o.shelf||[];o.goals=o.goals||[];
o.theme=o.theme||'auto';if(!('bk' in o))o.bk=null;
o.mood=o.mood||{};if(!('shift' in o))o.shift=null;if(!('moodNote' in o))o.moodNote=null;
o.stop=Object.assign({why:'',alts:DEF_ALTS.slice(),presses:[]},o.stop||{});
o.food=Object.assign({prof:null,kcal:0,custom:[],dishes:[],log:{},weight:[]},o.food||{});
o.train=Object.assign({step:2.5,ex:[],tpl:[],w:{},people:[]},o.train||{});
// профили: «Я» есть всегда; старые тренировки и шаблоны — мои
if(!o.train.people.some(x=>x.id=='me'))o.train.people.unshift({id:'me',n:'Я',c:'#6366f1',wk:3});
for(const k in o.train.w)if(!o.train.w[k].p)o.train.w[k].p='me';
o.train.tpl.forEach(T=>{if(!T.p)T.p='me'});
// цели с шагами привязываем к якорям, чтобы следующий шаг был виден прямо в карточке привычки
o.goals.forEach(g=>{if(g.type=='steps'&&!('h' in g)){const m=/англ/i.test(g.t)?'en':/сет/i.test(g.t)?'net':'';g.h=o.habits.some(x=>x.id==m)?m:''}});
// у целей постоянный id для синхронизации; старым даём g0, g1…, чтобы на разных устройствах они совпали
o.goals.forEach((g,i)=>{if(!g.id){let j=i;while(o.goals.some(x=>x.id=='g'+j))j++;g.id='g'+j}});
o.v=3;return o}

function rowsOf(o){
const R={cfg:{start:o.start,shift:o.shift,moodNote:o.moodNote,shelf:o.shelf},debt:o.debt,
food:{prof:o.food.prof,kcal:o.food.kcal,custom:o.food.custom,dishes:o.food.dishes,weight:o.food.weight}};
o.habits.forEach((x,i)=>R['h:'+x.id]=Object.assign({o:i},x));
o.goals.forEach((g,i)=>R['g:'+g.id]=Object.assign({o:i},g));
for(const d in o.logs)for(const h in o.logs[d])R['l:'+d+':'+h]=o.logs[d][h];
for(const d in o.mood)R['m:'+d]=o.mood[d];
for(const d in o.food.log)if(o.food.log[d].length)R['f:'+d]=o.food.log[d];
// тренировки: настройки, каждое упражнение, шаблон и тренировка — отдельной строкой
R.tcfg={step:o.train.step};
o.train.people.forEach((x,i)=>R['tp:'+x.id]=Object.assign({o:i},x));
o.train.ex.forEach((x,i)=>R['te:'+x.id]=Object.assign({o:i},x));
o.train.tpl.forEach((x,i)=>R['tt:'+x.id]=Object.assign({o:i},x));
for(const id in o.train.w)R['w:'+id]=o.train.w[id];
return R}
// обратно из строк в S; то, что живёт только на устройстве, берём из loc
function fromRows(R,loc){const c=R.cfg||{},f=R.food||{};
const o={v:3,start:c.start||today(),shift:c.shift||null,moodNote:c.moodNote||null,shelf:c.shelf||[],debt:R.debt||{total:0,paid:[]},
theme:loc.theme,bk:loc.bk,stop:loc.stop,logs:{},mood:{},
food:{prof:f.prof||null,kcal:f.kcal||0,custom:f.custom||[],dishes:f.dishes||[],weight:f.weight||[],log:{}}};
const list=p=>Object.keys(R).filter(k=>k.startsWith(p)).map(k=>R[k]).sort((a,b)=>a.o-b.o||(a.id<b.id?-1:1)).map(x=>{const y=Object.assign({},x);delete y.o;return y});
o.habits=list('h:');o.goals=list('g:');
o.train={step:(R.tcfg||{}).step||2.5,ex:list('te:'),tpl:list('tt:'),people:list('tp:'),w:{}};
for(const k in R){if(k.startsWith('l:')){const d=k.slice(2,12);(o.logs[d]=o.logs[d]||{})[k.slice(13)]=R[k]}
else if(k.startsWith('m:'))o.mood[k.slice(2)]=R[k];else if(k.startsWith('f:'))o.food.log[k.slice(2)]=R[k];else if(k.startsWith('w:'))o.train.w[k.slice(2)]=R[k]}
return o}

const canon=v=>v==null?'null':typeof v!='object'?JSON.stringify(v):Array.isArray(v)?'['+v.map(canon).join(',')+']':
'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
function hh(v){const s=canon(v);let a=0xdeadbeef,b=0x41c6ce57;
for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}
a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
return 4294967296*(2097151&b)+(a>>>0)}

// что поменялось с прошлой проверки: новые и изменённые строки ждут отправки, исчезнувшие помечаются удалёнными
function scan(){if(!M)return;const R=rowsOf(S),t=Date.now();let n=0;
for(const k in R){const h=hh(R[k]),m=M.r[k];if(!m||m[0]!==h){M.r[k]=[h,m?Math.max(t,m[1]+1):t,2];n++}}
for(const k in M.r){const m=M.r[k];if(!(k in R)&&!(m[2]&1)){M.r[k]=[0,Math.max(t,m[1]+1),3];n++}}
if(n)saveM()}
const waiting=()=>M?Object.values(M.r).filter(m=>m[2]&2).length:0;

// первый вход на устройстве. Здесь уже есть прогресс: выгружаем всё со старой меткой времени,
// чтобы при совпадении записей главным было облако. Устройство чистое: просто забираем облако.
function bind(uid){if(M&&M.uid==uid)return;
M={uid,cur:null,r:{}};
if(localStorage.getItem(K)===null)M.fresh=1;
else{M.first=1;const R=rowsOf(S);for(const k in R)M.r[k]=[hh(R[k]),SEED,2]}
saveM()}

const SEL='habits?select=id,data,deleted,updated_at,synced_at',pq=s=>'"'+String(s).replace(/["\\]/g,'\\$&')+'"';
// всё, что пришло на сервер после прошлого раза (с минутой внахлёст), страницами по 1000
async function pull(){
const rows=[];let after=M.cur?new Date(Date.parse(M.cur)-6e4).toISOString():null,id=null;
for(;;){let p=SEL+'&order=synced_at.asc,id.asc&limit=1000';
if(id!==null)p+='&or='+encodeURIComponent(`(synced_at.gt.${pq(after)},and(synced_at.eq.${pq(after)},id.gt.${pq(id)}))`);
else if(after)p+='&synced_at=gt.'+encodeURIComponent(after);
const part=await Cloud.rest('GET',p);rows.push(...part);
if(part.length<1000)return rows;
const z=part[part.length-1];after=z.synced_at;id=z.id}}

// правки с других устройств: берём строку, если она новее нашей (при равном времени — облачную)
function apply(rows){let R=null;
if(M.fresh&&rows.length){R={};M.r={}}
for(const r of rows){const u=Date.parse(r.updated_at),h=r.deleted?0:hh(r.data),m=M.r[r.id];
if(m&&u<m[1])continue;
if(m&&u==m[1]&&h===m[0]){m[2]&=~2;continue}
M.r[r.id]=[h,u,r.deleted?1:0];
if((m?m[0]:0)===h)continue;
R=R||rowsOf(S);if(r.deleted)delete R[r.id];else R[r.id]=r.data}
if(M.fresh&&!R)store(); // облако пустое: закрепляем то, что есть здесь, оно и уйдёт в облако
delete M.fresh;
if(!R)return false;
S=migrate(fromRows(R,S));store();return true}

async function push(){
for(;;){scan();const ks=Object.keys(M.r).filter(k=>M.r[k][2]&2).slice(0,200);if(!ks.length)return;
const R=rowsOf(S),sent=ks.map(k=>M.r[k][1]);
const ok=await Cloud.rest('POST','habits?on_conflict=user_id,id&select=id',ks.map(k=>{const m=M.r[k],del=!!(m[2]&1);
return{user_id:M.uid,id:k,data:del?null:R[k],deleted:del,updated_at:new Date(m[1]).toISOString()}}),'resolution=merge-duplicates,return=representation');
ks.forEach((k,i)=>{const m=M.r[k];if(m&&m[1]===sent[i])m[2]&=~2});saveM();
// сервер не принял строки, у которых его версия новее (так бывает, если часы устройств разошлись): забираем его версию
const got=new Set((ok||[]).map(r=>r.id)),lost=ks.filter(k=>!got.has(k));
for(let i=0;i<lost.length;i+=50){if($('sh').classList.contains('open'))break;
if(apply(await Cloud.rest('GET',SEL+'&id=in.'+encodeURIComponent('('+lost.slice(i,i+50).map(pq).join(',')+')')))){scan();render()}}
saveM()}}

async function sync(){
if(syncBusy){syncAgain=true;return}
const u=Cloud.on()&&Cloud.user();
if(u)bind(u.id);
scan();
if(!u)return setSync(Cloud.on()?'out':'');
if(!navigator.onLine)return setSync('net');
syncBusy=true;setSync('sync');
try{
const rows=await pull();
// открыта нижняя панель: S сейчас не трогаем, повторим позже
if($('sh').classList.contains('open')){setTimeout(()=>syncSoon(0),1e4);return}
scan();
if(M.first&&rows.some(r=>!r.deleted)){
try{localStorage.setItem(K+'_before_sync',JSON.stringify(S))}catch(e){}
if(!confirm('В облаке уже есть данные с другого устройства.\n\nОК — где записи совпали, оставить облачные.\nОтмена — где совпали, оставить данные этого устройства.\n\nВсё, что есть только здесь, добавится в облако в любом случае.')){
const t=Date.now();for(const k in M.r)if(M.r[k][2]&2)M.r[k][1]=t}}
delete M.first;
if(apply(rows)){scan();render()}
if(rows.length){const z=rows[rows.length-1].synced_at;if(!M.cur||Date.parse(z)>=Date.parse(M.cur))M.cur=z}
saveM();
await push();
syncAt=Date.now();setSync('ok')}
catch(e){setSync(e.net?'net':Cloud.user()?'err':'out',e.message)}
finally{syncBusy=false;if(syncAgain){syncAgain=false;syncSoon()}}}
function syncSoon(d){clearTimeout(syncT);syncT=setTimeout(sync,d===undefined?1500:d)}

// [коротко для заголовка, полностью для раздела в «Ещё»]
const SYNC={out:['Войти','Вход не выполнен'],sync:['Обмен…','Синхронизация…'],ok:['В облаке','Синхронизировано'],net:['Офлайн','Офлайн'],err:['Ошибка','Ошибка']};
const sst=()=>Cloud.user()?syncSt||'sync':'out';
function setSync(st,msg){syncSt=st;syncMsg=msg||'';const p=$('spill');if(p)p.outerHTML=pill();const s=$('syncSec');if(s)s.innerHTML=syncSec()}
const pill=()=>Cloud.on()?`<button id="spill" class="spill s-${sst()}" data-a="sgo">${SYNC[sst()][0]}</button>`:'';
function syncSec(){
if(!Cloud.on())return '<div class="mu" style="margin:0 4px">Не настроена: впиши адрес и ключ Supabase в начало cloud.js.</div>';
const u=Cloud.user(),st=sst(),n=waiting(),err=syncSt=='err'&&syncMsg?`<div class="mu" style="color:var(--wr);margin-top:6px">${esc(syncMsg)}</div>`:'';
if(!u)return `<div class="mu" style="margin:0 4px 10px">Войди, и привычки, цели, настроение, еда и долги будут на всех твоих устройствах. Красная кнопка остаётся только здесь.${err}</div><button class="btn" data-a="sin">Войти через GitHub</button>`;
return `<div class="card"><div class="mrow"><b>${esc(u.name?'@'+u.name:'GitHub')}</b><span class="spill s-${st}">${SYNC[st][1]}</span></div>`+
`<div class="mu" style="margin-top:6px">${syncAt?'Последний раз в '+tm(new Date(syncAt))+'. ':''}${n?'Ждут отправки: '+n+'.':'Все изменения в облаке.'}</div>`+
(st=='net'?'<div class="mu" style="margin-top:6px">Нет сети. Всё сохраняется здесь и уйдёт в облако, когда сеть появится.</div>':'')+err+
'</div><div class="row2"><button class="btn g" data-a="snow">Синхронизировать</button><button class="btn g" data-a="sout">Выйти</button></div>'}

// ---------- месяц и график ----------
const endD=()=>add(S.start,29);

function cnt(g){const e=endD();let n=0;for(const d in S.logs)if(d>=S.start&&d<=e&&S.logs[d][g.h])n++;return n}
function pct(g){if(g.type=='count')return Math.min(100,Math.round(cnt(g)/(g.target||1)*100));const n=g.steps.length;return n?Math.round(g.steps.filter(s=>s.done).length/n*100):0}
function total(){const a=S.goals.map(pct);return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0}
function weekDone(id,key){const d=pd(key);d.setDate(d.getDate()-(d.getDay()+6)%7);const m=dk(d);for(let i=0;i<7;i++)if(logged(add(m,i),id))return true;return false}
// 2/2: S.shift — любой день, который был первым днём смены
const cyc=key=>((diff(S.shift,key)%4)+4)%4;
const isShift=key=>S.shift?cyc(key)<2:null;
const shiftLabel=key=>!S.shift?'':isShift(key)?'Смена '+(cyc(key)+1)+'/2':'Выходной '+(cyc(key)-1)+'/2';

const fo=(a,i)=>({id:'b'+i,n:a[0],k:a[1],p:a[2],f:a[3],c:a[4],u:a[5]||'',ug:a[6]||0});
const allFoods=()=>S.food.custom.concat(FOODS.map(fo));
const findFood=id=>allFoods().find(x=>x.id==id);
const lastW=()=>{const W=S.food.weight;return W.length?W[W.length-1].kg:null};
function norm(){const P=S.food.prof;if(!P)return null;const w=lastW()||P.w;
let k=Math.round((10*w+6.25*P.h-5*P.age+5)*(ACT.find(a=>a[0]==P.act)||ACT[1])[3]+(P.goal=='gain'?400:0));
if(S.food.kcal)k=S.food.kcal;
const pr=Math.round(w*1.8),fa=Math.round(w);return{k,p:pr,f:fa,c:Math.max(0,Math.round((k-pr*4-fa*9)/4))}}
const dayFood=key=>(S.food.log[key]||[]).reduce((a,e)=>({k:a.k+e.k,p:a.p+e.p,f:a.f+e.f,c:a.c+e.c}),{k:0,p:0,f:0,c:0});
function entry(x,g){const m=g/100;return{n:x.n,g:Math.round(g),k:Math.round(x.k*m),p:+(x.p*m).toFixed(1),f:+(x.f*m).toFixed(1),c:+(x.c*m).toFixed(1)}}
function addEntries(key,arr){const L=S.food.log[key]=S.food.log[key]||[],t=tm(new Date());arr.forEach(e=>{const c=Object.assign({},e,{t});L.push(c)})}
const noT=e=>{const c=Object.assign({},e);delete c.t;return c};
function setWeight(d,kg){const W=S.food.weight,i=W.findIndex(x=>x.d==d);if(i>=0)W[i].kg=kg;else W.push({d,kg});W.sort((a,b)=>a.d<b.d?-1:1)}

// ---------- элементы ----------
function ring(v,sz,sw,col,trk,fs,lbl){const r=(sz-sw)/2,c=2*Math.PI*r,o=sz/2;
return `<div class="ring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}"><circle cx="${o}" cy="${o}" r="${r}" fill="none" style="stroke:${trk}" stroke-width="${sw}"/>`+
(v>0?`<circle cx="${o}" cy="${o}" r="${r}" fill="none" style="stroke:${col}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(v,100)/100)}"/>`:'')+
`</svg><span style="font-size:${fs}px">${lbl!==undefined?lbl:v+'%'}</span></div>`}
const seg=(name,opts,v)=>`<div class="seg" data-seg="${name}">`+opts.map(o=>`<button type="button" class="${o[0]==v?'on':''}" data-a="seg" data-v="${o[0]}">${o[1]}</button>`).join('')+'</div>';

const head=(sub,t)=>`<div class="top"><small>${sub}</small><div class="th"><h1>${t}</h1>${pill()}</div></div>`;

let sub=c?'Отмечено в '+L[x.id].t:x.w?(wd?'На этой неделе уже сделано':'Раз в неделю'):'Каждый день';
if(!c&&x.a&&isShift(key)===false)sub='Выходной: хватит минимума, '+esc(x.L[0]);

(D.k<N.k||D.p<N.p?'<button class="hbtn" data-a="fhelp">🍳 Как добрать?</button>':'')+'</div>';
h+=`<button class="btn" data-a="fadd">＋ Добавить еду</button><div class="row2"><button class="btn g" data-a="fdish">Мои блюда</button><button class="btn g" data-a="fcopy">Как вчера</button></div>`;
if(L.length){h+='<div class="card">';L.forEach((e,i)=>{h+=`<div class="li"><div class="ht"><b>${esc(e.n)}</b><small>${e.g?e.g+' г · ':''}${e.t||''}${e.p||e.f||e.c?' · Б '+Math.round(e.p)+' Ж '+Math.round(e.f)+' У '+Math.round(e.c):''}</small></div><b style="white-space:nowrap;font-size:15px">${e.k} ккал</b><button class="ib" data-a="fdel" data-i="${i}" aria-label="Удалить">✕</button></div>`});h+='</div>'}
else h+=`<div class="card mu">${day=='y'?'За вчера':'Сегодня'} пока ничего не записано.</div>`;
h+='<h2>Вес</h2><div class="card">';
if(W.length){const l=W[W.length-1],ref=W.find(x=>diff(x.d,l.d)<=28)||W[0],ch=+(l.kg-ref.kg).toFixed(1),wk=Math.round(diff(ref.d,l.d)/7);
h+=`<span style="font-size:28px;font-weight:800">${fmt(l.kg)} кг</span><div class="mu">${fmtD(l.d)}${wk>=1?' · за '+wk+' нед. '+(ch>0?'+':'')+fmt(ch)+' кг':''}</div>`+wchart(W.slice(-12));
if(diff(l.d,today())>=7)h+=`<div class="note am" style="margin:12px 0 0">Прошла неделя, пора взвеситься. Лучше утром, до еды.</div>`;
const r3=W.filter(x=>diff(x.d,l.d)<=21),span=r3.length>1?diff(r3[0].d,l.d)/7:0;
if(S.food.prof&&S.food.prof.goal=='gain'&&span>=2){const rate=(l.kg-r3[0].kg)/span;if(rate<0.2)h+=`<div class="note in" style="margin:12px 0 0">Вес почти стоит (${rate>0?'+':''}${fmt(+rate.toFixed(2))} кг в неделю). Для набора ориентир +0,25–0,5 кг. Можно поднять норму на 200 ккал.</div>`}}
else h+='<div class="mu">Взвешивайся раз в неделю, утром до еды. Здесь появится график.</div>';
h+='<button class="btn g" data-a="fw" style="margin:12px 0 0">Записать вес</button></div>';
h+=`<button class="btn g" data-a="fprof">${N?'Норма '+fmt(N.k)+' ккал, белок '+N.p+' г · изменить':'Настроить норму'}</button>`;
return h+'<div class="mu" style="padding:4px">Калорийность продуктов примерная, по таблицам. Норма считается по общей формуле, это не назначение врача.</div>'}

// ---------- тренировки ----------
// S.train: ex — библиотека {id,n,k}; tpl — шаблоны {id,n,items:[{e,n,k,sets,rest}]};
// w — тренировки по id {id,d,t,n,done,note,items:[{e,n,k,rest,note,sets:[{w,r,s,m,ok}]}]}. Имя и вид копируются в тренировку,
// чтобы старые записи читались, даже если упражнение переименовали или удалили.
const KINDS=[['wr','Вес × повторы'],['r','Повторы (+доп. вес)'],['t','Время'],['dt','Дистанция + время']],KN=Object.fromEntries(KINDS);
const KF={wr:[['w','Вес, кг'],['r','Повторы']],r:[['r','Повторы'],['w','Доп. вес, кг']],t:[['s','Время, сек']],dt:[['m','Дистанция, м'],['s','Время, сек']]};
let trV='cal',trM='',trD='',trW='',trE='',RT=null,rtI=null,AC=null;
// выбранный профиль — настройка этого устройства, в облако не уходит
let trP=(()=>{try{return localStorage.getItem('life_trp')||'me'}catch(e){return 'me'}})();
const setP=id=>{trP=id;try{localStorage.setItem('life_trp',id)}catch(e){}};
const profs=()=>S.train.people;
const profOf=id=>profs().find(x=>x.id==id)||profs()[0];
const pn=()=>profs().length>1?profOf(trP).n+' · ':'';
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const exOf=id=>S.train.ex.find(x=>x.id==id);
const exName=it=>(exOf(it.e)||{}).n||it.n||'Упражнение';
const exKind=it=>(exOf(it.e)||{}).k||it.k||'wr';
const fmtT=s=>Math.floor(s/60)+':'+p(Math.round(s%60));
const fmtSec=s=>s>=60?Math.floor(s/60)+':'+(s%60).toFixed(s%1?1:0).padStart(s%1?4:2,'0'):fmt(s)+' с';
const setTxt=(k,x)=>k=='wr'?fmt(x.w||0)+' кг × '+(x.r||0):k=='r'?(x.r||0)+' повт'+(x.w?' · +'+fmt(x.w)+' кг':''):k=='t'?fmtSec(x.s||0):fmt(x.m||0)+' м · '+fmtSec(x.s||0);
// сравнение подходов: вес × повторы — расчётный максимум на 1 повтор, повторы — сначала доп. вес, потом повторы,
// время — дольше лучше, дистанция — быстрее лучше (сравниваем только одинаковые дистанции)
const score=(k,x)=>k=='wr'?(x.w>0&&x.r>0?x.w*(1+(x.r-1)/30):0):k=='r'?(x.w||0)*1000+(x.r||0):k=='t'?x.s||0:x.s>0?-x.s:-1e9;
const wl=()=>Object.values(S.train.w).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.t<b.t?-1:a.t>b.t?1:0);
const wp=pp=>wl().filter(x=>(x.p||'me')==(pp||trP)); // тренировки одного профиля
const before=(a,b)=>a.d<b.d||(a.d==b.d&&a.t<b.t);
const gymHab=()=>hab('gym')||S.habits.find(h=>/зал|трен|спорт/i.test(h.n));
const weekStart=key=>{const d=pd(key);d.setDate(d.getDate()-(d.getDay()+6)%7);return dk(d)};
const doneIn=(a,b)=>wp().filter(x=>x.done&&x.d>=a&&x.d<=b).length;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
// последнее выполнение упражнения этим же человеком раньше тренировки w (без w — вообще последнее у профиля pp)
function lastOf(e,w,pp){let res=null;wp(w?w.p:pp).forEach(x=>{if(w&&(x.id==w.id||!before(x,w)))return;const it=x.items.find(i=>i.e==e&&i.sets.some(s=>s.ok));if(it)res={w:x,it}});return res}
function isRec(w,ii,si){const it=w.items[ii],k=exKind(it),x=it.sets[si],v=score(k,x);if(k!='dt'&&!(v>0))return false;
let b=null;const take=s=>{if(!s.ok||(k=='dt'&&s.m!=x.m))return;const u=score(k,s);if(b===null||u>b)b=u};
wp(w.p).forEach(o=>{if(o.id!=w.id&&before(o,w))o.items.forEach(i=>{if(i.e==it.e)i.sets.forEach(take)})});
if(b===null)return false; // первый раз — это ещё не рекорд, а точка отсчёта
w.items.forEach((i,j)=>{if(i.e==it.e)i.sets.forEach((s,q)=>{if(j<ii||(j==ii&&q<si))take(s)})});
return v>b}
function wStats(w){let n=0,ton=0;w.items.forEach(it=>{const k=exKind(it);it.sets.forEach(s=>{if(!s.ok)return;n++;if(k=='wr'||k=='r')ton+=(s.w||0)*(s.r||0)})});return{n,ton:Math.round(ton)}}
// новое упражнение в тренировке: подходы и веса с прошлого раза
function itemFor(e,cnt,rest,pp){const x=exOf(e)||{},L=lastOf(e,null,pp),src=L?L.it.sets.filter(s=>s.ok):[],sets=[],N=cnt||src.length||3;
for(let i=0;i<N;i++){const s=src[Math.min(i,src.length-1)];sets.push(s?{w:s.w,r:s.r,s:s.s,m:s.m,ok:false}:{w:0,r:0,s:0,m:0,ok:false})}
return{e,n:x.n,k:x.k,rest:rest||(L&&L.it.rest)||90,note:'',sets}}
function newW(d,t,n,src){const w={id:uid('w'),p:trP,d,t,n:n||'Тренировка',done:false,note:'',items:[]};
if(src[0]=='t'){const T=S.train.tpl.find(x=>x.id==src.slice(2));if(T){if(!n)w.n=T.n;w.items=T.items.map(i=>Object.assign(itemFor(i.e,i.sets,i.rest,trP),exOf(i.e)?{}:{n:i.n,k:i.k}))}}
else if(src[0]=='w'){const P=S.train.w[src.slice(2)];if(P){if(!n)w.n=P.n;w.items=P.items.map(i=>({e:i.e,n:i.n,k:i.k,rest:i.rest,note:'',sets:i.sets.map(s=>({w:s.w,r:s.r,s:s.s,m:s.m,ok:false}))}))}}
S.train.w[w.id]=w;return w}
function lchart(V){const w=300,hh=90,mn=Math.min(...V),mx=Math.max(...V),r=mx-mn||1;
const pts=V.map((v,i)=>[(i/(V.length-1))*(w-20)+10,hh-10-((v-mn)/r)*(hh-20)]);
return `<svg viewBox="0 0 ${w} ${hh}" style="width:100%;height:${hh}px;margin-top:10px;display:block"><polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" style="stroke:var(--ac)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`+
pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" style="fill:var(--ac)"/>`).join('')+'</svg>'}

const back=(v,l)=>`<button class="back" data-a="tv" data-v="${v}">‹ ${l}</button>`;
function vTrain(){if(!profs().some(x=>x.id==trP))setP('me');return({cal:tCal,day:tDay,w:tWork,lib:tLib,ex:tEx,tpls:tTpls}[trV]||tCal)()}
const pchips=()=>`<div class="pchips">${profs().map(x=>`<button class="${x.id==trP?'on':''}" style="--pc:${x.c}" data-a="tprof" data-p="${x.id}">${esc(x.n)}</button>`).join('')}<button data-a="tped" aria-label="Изменить профиль">✎</button><button data-a="tpnew" aria-label="Новый профиль">＋</button></div>`;
// у «Я» фирменный градиент, у остальных — свой цвет
const pHero=()=>trP=='me'?'':`style="background:linear-gradient(135deg,${profOf(trP).c},${profOf(trP).c}aa);box-shadow:0 14px 34px ${profOf(trP).c}55"`;

function tCal(){const t=today();if(!trM)trM=t.slice(0,7);
const [y,mo]=trM.split('-').map(Number),f=new Date(y,mo-1,1),off=(f.getDay()+6)%7,n=new Date(y,mo,0).getDate();
const P=profOf(trP),goal=P.wk||3,me=trP=='me',ws=weekStart(t),wk=doneIn(ws,add(ws,6)),inM=wp().filter(x=>x.done&&x.d.startsWith(trM)).length;
let h=head('Дневник','Тренировки')+pchips();
h+=`<div class="hero g4" ${pHero()}>${ring(Math.round(wk/goal*100),86,9,'#fff','rgba(255,255,255,.25)',22,wk+'/'+goal)}<div class="info"><b>${me?'':esc(P.n)+': '}на этой неделе ${wk} из ${goal}</b><p>За ${f.toLocaleDateString('ru-RU',{month:'long'})}: ${inM} ${plural(inM,'тренировка','тренировки','тренировок')}</p></div></div>`;
const L=wp().filter(x=>x.done).pop();
if(L&&diff(L.d,t)>=14)h+=`<div class="note in">${me?'С возвращением. Последняя тренировка была':'Последняя тренировка у '+esc(P.n)+' была'} ${fmtD(L.d)}: ${esc(L.n)}. В новой тренировке подставятся последние веса, от них и решай.</div>`;
h+=`<div class="card"><div class="exh" style="margin-bottom:10px"><button class="ib" data-a="tmon" data-d="-1" aria-label="Раньше">‹</button><b style="flex:1;text-align:center">${cap(f.toLocaleDateString('ru-RU',{month:'long',year:'numeric'}))}</b><button class="ib" data-a="tmon" data-d="1" aria-label="Позже">›</button></div><div class="cal tcal">`+
['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<i>${x}</i>`).join('')+'<i></i>'.repeat(off);
for(let i=1;i<=n;i++){const k=trM+'-'+p(i),W=wp().filter(x=>x.d==k);h+=`<button data-a="tday" data-d="${k}" class="${k==t?'td':''}">${i}<em class="${W.some(x=>x.done)?'d':W.length?'p':''}"></em></button>`}
h+='</div><div class="mu" style="margin-top:10px">● выполнена · ○ запланирована</div></div>';
const up=wp().filter(x=>!x.done&&x.d>=t).slice(0,3);
if(up.length)h+='<h2>Запланировано</h2><div class="card">'+up.map(x=>`<button class="li plain" style="width:100%" data-a="topen" data-id="${x.id}"><div class="ht"><b>${esc(x.n)}</b><small>${x.d==t?'Сегодня':fmtD(x.d)}, ${esc(x.t)}</small></div><span class="mu">›</span></button>`).join('')+'</div>';
h+=`<button class="btn" data-a="tday" data-d="${t}">Сегодня</button><div class="row2"><button class="btn g" data-a="tv" data-v="lib">Упражнения</button><button class="btn g" data-a="tv" data-v="tpls">Шаблоны</button></div>`;
return h}

function tDay(){const d=trD||today(),W=wp().filter(x=>x.d==d);
let h=back('cal','Календарь')+head(pn()+pd(d).toLocaleDateString('ru-RU',{weekday:'long'}),fmtD(d));
W.forEach(w=>{const st=wStats(w);h+=`<button class="card wcard" data-a="topen" data-id="${w.id}"><div class="exh"><b style="flex:1">${esc(w.t)} · ${esc(w.n)}</b><span class="tag" style="${w.done?'--ct:rgba(16,185,129,.15);--c:var(--ok)':''}">${w.done?'выполнена':'план'}</span></div>`+
`<div class="mu" style="margin-top:4px">${w.items.length?w.items.map(i=>esc(exName(i))).join(', '):'Пока без упражнений'}</div>${st.n?`<div class="mu">${st.n} подх.${st.ton?' · '+fmt(st.ton)+' кг тоннаж':''}</div>`:''}</button>`});
if(!W.length)h+=`<div class="card mu">${d>today()?'На этот день ничего не запланировано.':'В этот день тренировок нет.'}</div>`;
return h+'<button class="btn" data-a="tnew">＋ Тренировка</button>'}

function tWork(){const w=S.train.w[trW];if(!w){trV='cal';return tCal()}
let h=back('day',fmtD(w.d))+`<div class="top"><small>${profs().length>1?esc(profOf(w.p).n)+' · ':''}${esc(w.t)}${w.done?' · выполнена в '+esc(w.done):''}</small><div class="th"><h1>${esc(w.n)}</h1><button class="ib" data-a="twedit" aria-label="Изменить">✎</button></div></div>`;
if(w.note)h+=`<div class="note in">${esc(w.note)}</div>`;
w.items.forEach((it,ii)=>{const k=exKind(it),L=lastOf(it.e,w);
h+=`<div class="card"><div class="exh"><button class="plain ht" data-a="texv" data-e="${it.e}"><b>${esc(exName(it))}</b></button><button class="chipb" data-a="tiedit" data-i="${ii}">⏱ ${fmtT(it.rest||0)}</button><button class="ib" data-a="tiedit" data-i="${ii}" aria-label="Настройки упражнения">⋯</button></div>`+
`<div class="prev">${L?'В прошлый раз, '+fmtD(L.w.d)+': '+L.it.sets.filter(s=>s.ok).map(s=>setTxt(k,s)).join(' · '):'Первый раз: запиши, с чего начинаешь'}</div>`+
(it.note?`<div class="mu" style="margin-bottom:4px">📝 ${esc(it.note)}</div>`:'');
it.sets.forEach((s,si)=>{h+=`<div class="set ${s.ok?'dn':''}"><i>${si+1}</i><button class="sv" data-a="tsedit" data-i="${ii}" data-s="${si}">${setTxt(k,s)}</button><button class="sk" data-a="tsok" data-i="${ii}" data-s="${si}" aria-label="Подход сделан">✓</button></div>`});
h+=`<button class="btn g" data-a="tsadd" data-i="${ii}" style="margin:8px 0 0">＋ Подход</button></div>`});
if(!w.items.length)h+='<div class="card mu">Добавь первое упражнение. Подходы и веса подставятся с прошлого раза.</div>';
h+='<button class="btn g" data-a="texadd">＋ Упражнение</button>';
h+=w.done?'<button class="btn g" data-a="tfin">Снять отметку «выполнена»</button>':'<button class="btn" data-a="tfin">✓ Завершить тренировку</button>';
return h+'<div class="row2"><button class="btn g" data-a="ttplsave">Сохранить как шаблон</button><button class="btn r" data-a="twdel">Удалить</button></div>'}

function tLib(){let h=back('cal','Календарь')+head('Библиотека','Упражнения');
const X=S.train.ex.slice().sort((a,b)=>a.n.localeCompare(b.n,'ru'));
if(X.length)h+='<div class="card">'+X.map(x=>{const L=lastOf(x.id,null);return `<button class="li plain" style="width:100%" data-a="texv" data-e="${x.id}"><div class="ht"><b>${esc(x.n)}</b><small>${KN[x.k]}${L?' · '+fmtD(L.w.d)+': '+L.it.sets.filter(s=>s.ok).slice(0,3).map(s=>setTxt(x.k,s)).join(' · '):''}</small></div><span class="mu">›</span></button>`}).join('')+'</div>';
else h+='<div class="card mu">Упражнений пока нет. Они появятся здесь, когда добавишь их в тренировку.</div>';
return h+'<button class="btn g" data-a="texnew">＋ Новое упражнение</button>'}

function tEx(){const x=exOf(trE);if(!x){trV='lib';return tLib()}
const H=[];wp().forEach(w=>w.items.forEach(it=>{if(it.e==x.id&&it.sets.some(s=>s.ok))H.push({w,sets:it.sets.filter(s=>s.ok)})}));
let h=back('lib','Упражнения')+`<div class="top"><small>${esc(pn())}${KN[x.k]}</small><div class="th"><h1>${esc(x.n)}</h1><button class="ib" data-a="texed" data-e="${x.id}" aria-label="Изменить">✎</button></div></div>`;
if(!H.length)return h+'<div class="card mu">Пока нет выполненных подходов. Отмечай их ✓ в тренировке, и здесь появятся рекорды и история.</div>';
if(x.k=='dt'){const by={};H.forEach(o=>o.sets.forEach(s=>{if(s.s>0&&(!by[s.m]||s.s<by[s.m].s.s))by[s.m]={s,d:o.w.d}}));
h+='<div class="card"><b>Лучшее время</b>'+Object.keys(by).sort((a,b)=>a-b).map(m=>`<div class="link"><span>${fmt(m)} м</span><b>${fmtSec(by[m].s.s)} · ${fmtD(by[m].d)}</b></div>`).join('')+'</div>'}
else{let best=null;H.forEach(o=>o.sets.forEach(s=>{const v=score(x.k,s);if(!best||v>best.v)best={v,s,d:o.w.d}}));
h+=`<div class="hero g4"><div class="info"><p style="margin:0">🏆 Рекорд</p><b style="font-size:26px">${setTxt(x.k,best.s)}</b><p>${fmtD(best.d)}${x.k=='wr'?' · максимум на 1 повтор ≈ '+fmt(Math.round(best.v*2)/2)+' кг':''}</p></div></div>`;
const V=H.map(o=>Math.max(...o.sets.map(s=>x.k=='wr'?score('wr',s):x.k=='r'?s.r||0:s.s||0)));
if(V.length>1)h+=`<div class="card"><b>${x.k=='wr'?'Расчётный максимум на 1 повтор, кг':x.k=='r'?'Лучшие повторы':'Лучшее время, сек'}</b>${lchart(V.slice(-20))}</div>`}
return h+'<h2>История</h2><div class="card">'+H.slice().reverse().map(o=>`<div class="li"><div class="ht"><b>${fmtD(o.w.d)} · ${esc(o.w.n)}</b><small>${o.sets.map(s=>setTxt(x.k,s)).join(' · ')}</small></div></div>`).join('')+'</div>'}

function tTpls(){const me=trP=='me',TP=S.train.tpl.filter(T=>(T.p||'me')==trP);
let h=back('cal','Календарь')+head(me?'Твои программы':'Программы: '+esc(profOf(trP).n),'Шаблоны');
if(TP.length)h+='<div class="card">'+TP.map(T=>`<div class="li"><div class="ht"><b>${esc(T.n)}</b><small>${T.items.map(it=>esc(exName(it))+' ('+it.sets+')').join(', ')}</small></div><button class="ib" data-a="ttpldel" data-id="${T.id}" aria-label="Удалить">✕</button></div>`).join('')+'</div>';
else h+='<div class="card mu">Шаблонов пока нет. Собери тренировку и нажми внизу «Сохранить как шаблон».</div>';
return h+'<div class="mu" style="padding:4px">Чтобы изменить шаблон, начни по нему тренировку, поправь и сохрани как шаблон с тем же названием.</div>'}

// таймер отдыха: работает, пока приложение открыто; звук через Web Audio (на iPhone вибрации нет)
function beep(){try{[0,.3,.6].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.frequency.value=880;o.connect(g);g.connect(AC.destination);
g.gain.setValueAtTime(.3,s);g.gain.exponentialRampToValueAtTime(.001,s+.22);o.start(s);o.stop(s+.23)})}catch(e){}}
function restStart(sec){if(!sec)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
RT={end:Date.now()+sec*1000};clearInterval(rtI);rtI=setInterval(restTick,250);restTick()}
function restTick(){const el=$('rest');if(!RT){clearInterval(rtI);el.className='';return}
const left=Math.ceil((RT.end-Date.now())/1000);
if(left<=0){RT=null;clearInterval(rtI);beep();if(navigator.vibrate)navigator.vibrate(300);el.className='on done';el.innerHTML='<b>Отдых закончился</b>';setTimeout(()=>{if(!RT)el.className=''},2500);return}
el.className='on';el.innerHTML=`<span>Отдых</span><b>${fmtT(left)}</b><button data-a="r15">+15 с</button><button data-a="rx" aria-label="Остановить">✕</button>`}

function openSheet(title,body,onSave,onDel,delLabel){
sheetSave=onSave;sheetDel=onDel;
const btns=onSave?'<button class="btn g" data-a="sclose">Отмена</button><button class="btn" data-a="ssave">Сохранить</button>':'<button class="btn g" data-a="sclose">Закрыть</button>';
$('sh').innerHTML=`<div class="ov" data-a="sclose"></div><div class="pn"><div class="grab"></div><h3>${esc(title)}</h3>${body}<div class="sb">${btns}</div>${onDel?`<button class="btn r" data-a="sdel" style="margin:10px 0 0">${delLabel||'Удалить'}</button>`:''}</div>`;

function closeSheet(){$('sh').classList.remove('open');$('sh').innerHTML='';sheetSave=sheetDel=null;curFood=null}
// свайп вниз закрывает панель; если внутри что-то прокручено, сначала работает обычная прокрутка
let drag=null;
$('sh').addEventListener('touchstart',e=>{const pn=e.target.closest('.pn');if(!pn)return;
for(let el=e.target;el&&el!=$('sh');el=el.parentNode)if(el.scrollTop>0)return;
drag={pn,ov:$('sh').querySelector('.ov'),y:e.touches[0].clientY,t:Date.now(),dy:0,on:false}},{passive:true});
$('sh').addEventListener('touchmove',e=>{if(!drag)return;const dy=e.touches[0].clientY-drag.y;
if(!drag.on){if(dy<-4){drag=null;return}if(dy<8)return;drag.on=true;drag.y+=8;drag.pn.style.transition='none'}
drag.dy=Math.max(0,e.touches[0].clientY-drag.y);drag.pn.style.transform=`translateY(${drag.dy}px)`;
if(drag.ov)drag.ov.style.opacity=Math.max(0,1-drag.dy/400);e.preventDefault()},{passive:false});
function dragEnd(){const d=drag;drag=null;if(!d||!d.on)return;
d.pn.style.transition='transform .22s ease';if(d.ov)d.ov.style.transition='opacity .22s';
if(d.dy>110||(d.dy>40&&d.dy/(Date.now()-d.t)>0.5)){d.pn.style.transform='translateY(100%)';if(d.ov)d.ov.style.opacity=0;setTimeout(closeSheet,200)}
else{d.pn.style.transform='';if(d.ov)d.ov.style.opacity=''}}
$('sh').addEventListener('touchend',dragEnd);$('sh').addEventListener('touchcancel',dragEnd);

function links(){
const days=[];for(let i=0;i<60;i++){const k=ago(i),M=S.mood[k];if(M&&M.pm)days.push(k)}
if(days.length<14)return `<h2>Связи</h2><div class="mu">Появятся, когда наберётся 14 дней с итогом дня. Сейчас: ${days.length}.</div>`;
const out=[];
const cmp=(label,test)=>{const y=[],n=[];days.forEach(k=>{const r=test(k);if(r===true)y.push(S.mood[k].pm);else if(r===false)n.push(S.mood[k].pm)});
if(y.length>=3&&n.length>=3)out.push({label,a:avg(y),b:avg(n)})};
S.habits.forEach(x=>cmp(esc(x.ic)+' '+esc(x.n),k=>logged(k,x.id)));
cmp('Правило 4 часов соблюдено',k=>S.mood[k].rule);
if(S.shift)cmp('Смена, а не выходной',k=>isShift(k));
out.sort((p,q)=>Math.abs(q.a-q.b)-Math.abs(p.a-p.b));
let h='<h2>Связи</h2><div class="mu">Средний итог дня: когда было / когда не было.</div>'+out.slice(0,6).map(o=>`<div class="link"><span>${o.label}</span><b>${o.a.toFixed(1)} / ${o.b.toFixed(1)}</b></div>`).join('');
const anc=S.habits.filter(x=>x.a),bad=[],good=[];
if(anc.length)for(let i=0;i<60;i++){const k=ago(i),M=S.mood[k];if(!M||!M.am)continue;const done=anc.some(a=>logged(k,a.id))?1:0;if(M.am<=2)bad.push(done);else if(M.am>=4)good.push(done)}
if(bad.length>=3&&good.length>=3)h+=`<div class="link"><span>Якоря сделаны после плохого утра / хорошего</span><b>${Math.round(avg(bad)*100)}% / ${Math.round(avg(good)*100)}%</b></div>`;
return h}

function stopTick(){if(!SC)return;const el=$('stt');if(el)el.textContent=left();if(SC.step=='wait'&&Date.now()-SC.t0>=STOP_MIN*6e4){SC.step='ask';stopRender()}}
function stopClose(){clearInterval(stopTimer);SC=null;$('stop').classList.remove('open','won');$('stop').innerHTML='';save();render()}
function stopRender(){
const P=S.stop,c=SC,won=P.presses.filter(x=>x.r=='won').length,times=n=>n+' '+plural(n,'раз','раза','раз');
let h='<button class="sclose" data-a="sx" aria-label="Закрыть">✕</button><div class="in2">';
if(c.step=='wait'||c.step=='ask'){
h+=`<div class="sbig">Стоп.</div><div class="slead">Дай себе ${STOP_MIN} минут. Желание накатывает волной и спадает.</div><div class="stimer" id="stt">${left()}</div>`;
h+=`<div class="sbox"><small>Зачем я меняюсь</small>${P.why?esc(P.why).replace(/\n/g,'<br>'):'<span style="opacity:.6">Здесь будут твои слова. Напиши их в «Ещё» → «Красная кнопка».</span>'}</div>`;
if(won)h+=`<div class="sbox"><small>Ты уже передумал</small><span style="font-size:24px;font-weight:800">${times(won)}</span></div>`;
if(P.alts.length)h+='<div class="sbox"><small>Вместо этого, выбери одно</small>'+P.alts.map((a,i)=>`<button class="salt ${c.alt===i?'on':''}" data-a="salt" data-i="${i}">${esc(a)}</button>`).join('')+'</div>';
if(c.step=='ask')h+=`<div class="sq">${STOP_MIN} минут прошли. Отпустило?</div>`;
h+=`<button class="sbtn" data-a="swon">${c.step=='ask'?'Да, передумал':'Я передумал'}</button><button class="sbtn gh" data-a="sslip">${c.step=='ask'?'Всё равно хочу':'Не могу ждать'}</button>`}
else if(c.step=='trig')h+='<div class="sbig m">Ок. Без упрёков.</div><div class="slead">Что запустило? Это только для тебя.</div>'+TRIG.map(t=>`<button class="salt" data-a="strig" data-v="${t}">${t}</button>`).join('');
else if(c.step=='give')h+='<div class="sbig m">Сколько даёшь себе?</div><div class="slead">Ограничение лучше, чем «всё или ничего».</div>'+[[30,'30 минут'],[60,'1 час']].map(o=>`<button class="salt" data-a="sgive" data-v="${o[0]}">${o[1]}</button>`).join('');
else if(c.step=='slip')h+=`<div class="sbig m">Это не конец.</div><div class="sbox">Поставь таймер в «Часах» на ${c.give==60?'1 час':'30 минут'}. Когда зазвонит, вставай и выходи из комнаты.</div><div class="sbox">Срыв — это один эпизод, а не итог. Завтра обычный день по плану.</div><button class="sbtn" data-a="sx">Закрыть</button>`;
else if(c.step=='won')h+=`<div class="sbig">Победа.</div><div class="slead" style="font-size:20px;font-weight:700;opacity:1">Ты передумал уже ${times(won)}.</div><div class="sbox">${c.alt!==null?'Теперь сделай: <b>'+esc(P.alts[c.alt])+'</b>':'Сделай сейчас одно из «вместо этого», пока желание не вернулось.'}</div><button class="sbtn" data-a="sx">Закрыть</button>`;
$('stop').innerHTML=h+'</div>';$('stop').classList.toggle('won',c.step=='won')}
function stopSheet(){const P=S.stop;
openSheet('Красная кнопка',`<label class="lb">Зачем я меняюсь, твоими словами</label><textarea class="in" id="f_wy" rows="4" placeholder="Это ты увидишь при каждом нажатии">${esc(P.why)}</textarea>`+
`<label class="lb">Вместо этого, каждое с новой строки</label><textarea class="in" id="f_alts" rows="5">${esc(P.alts.join('\n'))}</textarea>`,
()=>{P.why=$('f_wy').value.trim();P.alts=$('f_alts').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6);return true},null)}

// ---------- отчёт и прочее ----------
function report(){
const d=S.debt,pdx=d.paid.reduce((a,b)=>a+b.s,0);
let r=`Отчёт на ${nowS()}, день ${Math.min(dayN(),30)} из 30. Общий прогресс: ${total()}%\n`;
if(S.shift)r+=`График 2/2: сегодня ${isShift(today())?'смена':'выходной'}\n`;
r+='Цели:\n';
S.goals.forEach(g=>{r+=`- ${g.t}: ${pct(g)}%`+(g.type=='count'?` (${cnt(g)} из ${g.target})`:'')+'\n'});
r+='Привычки за последние 7 дней:\n';
S.habits.forEach(x=>{let k=0;for(let i=0;i<7;i++)if(logged(ago(i),x.id))k++;r+=`- ${x.n}: ${k} из 7\n`});
const ms=[];for(let i=6;i>=0;i--){const k=ago(i);if(S.mood[k])ms.push([k,S.mood[k]])}
if(ms.length){const am=ms.filter(x=>x[1].am).map(x=>x[1].am),pm=ms.filter(x=>x[1].pm).map(x=>x[1].pm);
r+=`Настроение за 7 дней (из 5): утро в среднем ${am.length?avg(am).toFixed(1):'—'}, итог дня ${pm.length?avg(pm).toFixed(1):'—'}, тяжёлых дней (1–2): ${pm.filter(v=>v<=2).length}\n`;
ms.forEach(([k,M])=>{if(M.what||M.win||(M.tags&&M.tags.length))r+=`- ${k}${M.pm?' ('+M.pm+'/5)':''}${M.tags&&M.tags.length?' ['+M.tags.join(', ')+']':''}${M.what?': '+M.what:''}${M.win?' | получилось: '+M.win:''}\n`});
const rl=ms.filter(x=>x[1].rule!==undefined);if(rl.length)r+=`Правило 4 часов: соблюдено ${rl.filter(x=>x[1].rule).length} из ${rl.length} смен\n`}
r+=`Засчитано «получилось» за месяц: ${wins()}\n`;
const fd=[];for(let i=1;i<=7;i++){const k=ago(i);if((S.food.log[k]||[]).length)fd.push(dayFood(k))}
const N=norm();if(fd.length)r+=`Еда (прошлые 7 дней, записано ${fd.length}): в среднем ${Math.round(avg(fd.map(x=>x.k)))} ккал, белок ${Math.round(avg(fd.map(x=>x.p)))} г${N?' (норма '+N.k+' ккал, белок '+N.p+' г)':''}\n`;
const W=S.food.weight;if(W.length){const l=W[W.length-1],f=W.find(x=>diff(x.d,l.d)<=28)||W[0];r+=`Вес: ${l.kg} кг (${l.d})${f!==l?', с '+f.d+': '+(l.kg-f.kg>0?'+':'')+(l.kg-f.kg).toFixed(1)+' кг':''}\n`}
// в отчёт — только мои тренировки
const tw=wp('me').filter(x=>x.done&&x.d>=ago(6));
if(wp('me').length){r+=`Тренировки за 7 дней: ${tw.length}${tw.length?' ('+tw.map(x=>x.n).join(', ')+')':''}\n`;
const recs=[];tw.forEach(w=>w.items.forEach((it,ii)=>it.sets.forEach((s,si)=>{if(s.ok&&isRec(w,ii,si))recs.push(exName(it)+' '+setTxt(exKind(it),s))})));
if(recs.length)r+=`Рекорды за неделю: ${recs.join('; ')}\n`}
// красная кнопка: в отчёт только число нажатий
const pr=S.stop.presses;r+=`Красная кнопка: нажатий за 7 дней ${pr.filter(x=>x.t.slice(0,10)>=ago(6)).length}, за месяц ${pr.filter(x=>x.t.slice(0,10)>=S.start).length}\n`;
return r+'Долги выплачены на '+(d.total?Math.round(pdx/d.total*100):0)+'%'}
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
function copyIO(text){const io=$('io');io.value=text;io.select();
if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Скопировано'),()=>toast('Выдели текст и скопируй'))}
function applyTheme(){const r=document.documentElement;if(S.theme=='auto')r.removeAttribute('data-theme');else r.dataset.theme=S.theme;
document.querySelector('meta[name=theme-color]').content=getComputedStyle(r).getPropertyValue('--bg').trim()}

document.addEventListener('input',e=>{const id=e.target.id;
if(id=='f_q')$('f_res').innerHTML=foodList(e.target.value);else if(id=='f_a'&&curFood)pv(curFood);else if(id=='f_xq')$('f_xr').innerHTML=exList(e.target.value)});

document.addEventListener('click',e=>{
const b=e.target.closest('[data-a]');if(!b)return;
const a=b.dataset.a,D=b.dataset;
switch(a){
case 'tab':if(tab==D.t&&D.t=='train')trV='cal';tab=D.t;render();window.scrollTo(0,0);return;
case 'day':day=D.d;render();return;
case 'seg':{if(b.classList.contains('on'))return;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));whens();
if(b.parentNode.dataset.seg=='unit'&&curFood){const n=num($('f_a').value)||0;$('f_a').value=D.v=='g'?Math.round(n*curFood.ug):+(n/curFood.ug).toFixed(1);
$('f_al').textContent=D.v=='g'?'Сколько грамм':'Сколько ('+curFood.u+')';pv(curFood)}
if(b.parentNode.dataset.seg=='hm')$('f_rl').innerHTML=recList(D.v);return}
case 'sw':b.parentNode.dataset.v=D.c;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));return;
case 'chip':b.classList.toggle('on');return;
case 'fsel':b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x==b));return;
case 'sclose':closeSheet();return;
case 'ssave':if(!(sheetSave&&sheetSave()))return;closeSheet();break;
case 'sdel':if(!(sheetDel&&sheetDel()))return;closeSheet();break;
case 'lv':{const d=fkey();S.logs[d]=S.logs[d]||{};const c=S.logs[d][D.h];
if(c&&c.lvl==D.i)delete S.logs[d][D.h];else S.logs[d][D.h]={lvl:+D.i,t:day=='y'?'(за вчера) '+tm(new Date()):tm(new Date())};break}
case 'stp':{const s=S.goals[D.g].steps[D.s];s.done=s.done?null:nowS();if(s.done)toast('Шаг засчитан ✓');break}
case 'egoal':goalSheet(+D.g);return;
case 'ehab':habitSheet(+D.i);return;
case 'hmv':{const i=+D.i,j=i+ +D.d,H=S.habits;[H[i],H[j]]=[H[j],H[i]];break}
case 'shift':shiftSheet();return;
// настроение
case 'mam':{const k=fkey(),m=S.mood[k]=S.mood[k]||{};if(m.am==D.v)delete m.am;else m.am=+D.v;break}
case 'mpm':{const k=fkey(),m=S.mood[k]=S.mood[k]||{};m.pm=+D.v;save();render();moodSheet(k);return}
case 'medit':moodSheet(fkey());return;
case 'mhist':moodHist();return;
case 'mday':b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x==b));$('f_md').innerHTML=mdet(D.d);return;
case 'mnote':S.moodNote=today();break;
// тренировки
case 'tv':trV=D.v;render();window.scrollTo(0,0);return;
case 'tmon':{const [y,m]=trM.split('-').map(Number),d=new Date(y,m-1+ +D.d,1);trM=dk(d).slice(0,7);render();return}
case 'tday':trD=D.d;trV='day';tab='train';render();window.scrollTo(0,0);return;
case 'tprof':setP(D.p);trV='cal';render();return;
case 'tped':profTSheet(trP);return;
case 'tpnew':profTSheet(null);return;
case 'topen':{const w=S.train.w[D.id];if(!w)return;tab='train';setP(w.p||'me');trD=w.d;trW=w.id;trV='w';closeSheet();render();window.scrollTo(0,0);return}
case 'texv':trE=D.e;trV='ex';render();window.scrollTo(0,0);return;
case 'tnew':newWSheet(trD||today());return;
case 'twedit':wSheet();return;
case 'twdel':{const w=S.train.w[trW];if(!confirm('Удалить тренировку «'+w.n+'» за '+fmtD(w.d)+'?'))return;delete S.train.w[trW];trV='day';break}
case 'texadd':exPickSheet();return;
case 'texnew':exSheet(null);return;
case 'texed':exSheet(D.e);return;
case 'texpick':{const w=S.train.w[trW];if(!w)return;w.items.push(itemFor(D.e,0,0,w.p));closeSheet();break}
case 'tiedit':itemSheet(+D.i);return;
case 'timv':{const it=S.train.w[trW].items,i=+D.i,j=i+ +D.d;[it[i],it[j]]=[it[j],it[i]];closeSheet();break}
case 'tsedit':setSheet(+D.i,+D.s);return;
case 'tsadd':{const it=S.train.w[trW].items[D.i],L=it.sets[it.sets.length-1];it.sets.push(L?{w:L.w,r:L.r,s:L.s,m:L.m,ok:false}:{w:0,r:0,s:0,m:0,ok:false});break}
case 'tsok':{const w=S.train.w[trW],it=w.items[D.i],s=it.sets[D.s];s.ok=!s.ok;
if(s.ok){restStart(it.rest);if(isRec(w,+D.i,+D.s))toast('🏆 Рекорд: '+exName(it))}break}
case 'sv':{const el=$('f_'+D.f);el.value=Math.max(0,Math.round(((num(el.value)||0)+ +D.d)*100)/100);return}
case 'tfin':{const w=S.train.w[trW];if(w.done){w.done=false;break}w.done=tm(new Date());
// привычку «Зал» отмечают только мои тренировки, не тех, кого я тренирую
const hb=(w.p||'me')=='me'?gymHab():null;if(hb){const L=S.logs[w.d]=S.logs[w.d]||{};if(!L[hb.id])L[hb.id]={lvl:1,t:'тренировка '+w.t}}
let n=0;w.items.forEach((it,ii)=>it.sets.forEach((s,si)=>{if(s.ok&&isRec(w,ii,si))n++}));
toast(n?'🏆 Рекордов в тренировке: '+n:'Тренировка записана'+(hb?' · '+hb.n+' ✓':''));break}
case 'ttplsave':tplSaveSheet();return;
case 'ttpldel':{const T=S.train.tpl.find(x=>x.id==D.id);if(!T||!confirm('Удалить шаблон «'+T.n+'»? Тренировки по нему останутся.'))return;S.train.tpl=S.train.tpl.filter(x=>x!==T);break}
case 'r15':if(RT){RT.end+=15000;restTick()}return;
case 'rx':RT=null;restTick();return;
// еда
case 'fadd':foodSheet();return;
case 'fhelp':helpSheet(D.m);return;
case 'radd':{const r=RC[D.i];addEntries(fkey(),[{n:r.n,g:r.g,k:r.k,p:r.p,f:r.f,c:r.c}]);closeSheet();toast('Записано: '+r.k+' ккал');break}
case 'fpick':amountSheet(D.id);return;
case 'fnew':customSheet();return;
case 'fquick':quickSheet();return;
case 'fdish':dishSheet();return;
case 'dnew':dishNew();return;
case 'dadd':{const d=S.food.dishes[D.i];addEntries(fkey(),d.items);closeSheet();toast('Добавлено: '+d.n);break}
case 'ddel':if(!confirm('Удалить блюдо «'+S.food.dishes[D.i].n+'»?'))return;S.food.dishes.splice(+D.i,1);save();dishSheet();return;
case 'fcopy':{const src=S.food.log[add(fkey(),-1)]||[];if(!src.length){toast('Днём раньше записей нет');return}addEntries(fkey(),src.map(noT));toast('Добавлено записей: '+src.length);break}
case 'fdel':{const L=S.food.log[fkey()];if(!confirm('Удалить «'+L[D.i].n+'»?'))return;L.splice(+D.i,1);break}
case 'fw':numSheet('Вес','Вес, кг (утром, до еды)',lastW()||'',n=>{if(!(n>30&&n<250)){alert('Проверь число');return}setWeight(today(),n);return true});return;
case 'fprof':profSheet();return;
// красная кнопка
case 'stop':stopOpen();return;
case 'salt':SC.alt=+D.i;stopRender();return;
case 'swon':rec().r='won';SC.step='won';clearInterval(stopTimer);save();stopRender();return;
case 'sslip':SC.step='trig';clearInterval(stopTimer);stopRender();return;
case 'strig':rec().trig=D.v;SC.step='give';save();stopRender();return;
case 'sgive':rec().give=+D.v;rec().r='slip';SC.give=+D.v;SC.step='slip';save();stopRender();return;
case 'sx':stopClose();return;
case 'stopset':stopSheet();return;
// долги, полка, данные
case 'pay':numSheet('Выплата','Сумма выплаты','',n=>{if(!n){alert('Сумма должна быть больше нуля');return}S.debt.paid.push({s:n,d:nowS()});return true});return;
case 'tot':numSheet('Общая сумма долгов','Сколько всего нужно выплатить',S.debt.total||'',n=>{S.debt.total=n;return true});return;
case 'dpay':if(!confirm('Удалить выплату '+fmt(S.debt.paid[D.i].s)+'?'))return;S.debt.paid.splice(+D.i,1);break;
case 'ash':openSheet('На полку идей','<label class="lb">Что отложить на потом</label><input class="in" id="f_v">',()=>{const t=$('f_v').value.trim();if(!t)return;S.shelf.push(t);return true},null);return;
case 'dsh':if(!confirm('Убрать «'+S.shelf[D.i]+'» с полки?'))return;S.shelf.splice(+D.i,1);break;
case 'theme':S.theme=D.v;applyTheme();break;
// облако
case 'sgo':tab='more';render();$('syncSec').scrollIntoView({block:'center'});return;
case 'sin':if(!navigator.onLine){toast('Нет сети');return}Cloud.signIn().catch(()=>toast('Не удалось начать вход'));return;
case 'snow':sync();return;
case 'sout':if(!confirm('Выйти из аккаунта? Данные на этом устройстве останутся.'))return;Cloud.signOut().then(()=>{syncSt='';render()});return;
case 'newm':if(!confirm('Начать новый месяц? Отметки сохранятся, цели месяца начнут считаться с сегодня, шаги сбросятся.'))return;
S.start=today();S.goals.forEach(g=>{if(g.type=='steps')g.steps.forEach(s=>{s.done=null})});break;
case 'rep':copyIO(report());return;
case 'exp':S.bk=today();save();copyIO(JSON.stringify(S));toast('Копия готова. Сохрани её в Заметки');return;
case 'imp':{let o;try{o=JSON.parse($('io').value)}catch(x){alert('Не удалось прочитать текст');return}
if(!o||!o.v||!o.goals){alert('Это не копия данных');return}
if(!confirm('Заменить текущие данные этой копией?'))return;
S=migrate(o);applyTheme();toast('Копия загружена');break}
default:return}
save();render()});

// если приложение висело открытым, после полуночи переключаемся на новый день
function refresh(){if(shownDay!=today()){day='t';render()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
window.addEventListener('pageshow',refresh);
window.addEventListener('focus',refresh);
setInterval(refresh,60000);

load();applyTheme();render();
// облако: вернулись со входа — показываем, потом синхронизируем; дальше после каждой правки, при появлении сети и при открытии
Cloud.ready.then(back=>{if(back)render();sync()},e=>setSync('err','Вход не удался: '+e.message));
window.addEventListener('online',()=>syncSoon(0));
window.addEventListener('offline',()=>{if(Cloud.user())setSync('net')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncSoon(0)});
setInterval(()=>{if(!document.hidden)sync()},3e5);
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
